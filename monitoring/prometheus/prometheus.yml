global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Transaction Service metrics
  - job_name: 'transaction-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['transaction-service:8080']
        labels:
          service: 'transaction-service'

  # Fraud Analysis Service metrics
  - job_name: 'fraud-analysis-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['fraud-analysis-service:8081']
        labels:
          service: 'fraud-analysis-service'
